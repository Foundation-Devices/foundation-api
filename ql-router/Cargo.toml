[package]
name = "ql-router"
version = "0.1.0"
edition = "2021"
description = "QuantumLink router protocol and client"
license = "Proprietary"

[features]
default = []
tokio = ["dep:tokio", "ql-wire/software-crypto"]

[dependencies]
bytes = { workspace = true }
ql-codec = { workspace = true }
ql-wire = { workspace = true }
tokio = { version = "1", features = ["io-util", "net"], optional = true }
