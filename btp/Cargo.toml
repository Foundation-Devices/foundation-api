[package]
name = "btp"
version = "0.1.0"
edition = "2021"
homepage.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# host-protocol_v4.0.0, the BLE protocol release Passport Prime builds with
consts = { git = "https://github.com/Foundation-Devices/prime-ble-firmware.git", rev = "6c29bc743e2986451f9ea5063be916eb0d55df6a", features = [
    "dle",
] }
getrandom = { workspace = true }
thiserror = "2"

[dev-dependencies]
rand = "0.9"
